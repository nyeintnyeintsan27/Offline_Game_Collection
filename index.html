      // GAME 7: Snake Game
      function snakeGame() {
        return function (container, gameId) {
          let snake = [{ x: 8, y: 8 }];
          let direction = { x: 1, y: 0 };
          let nextDirection = { x: 1, y: 0 };
          let food = { x: 12, y: 8 };
          let score = 0;
          let gameOver = false;
          let gameLoop = null;
          let bestScore = HighScoreManager.get(gameId);
          const GRID_SIZE = 18;
          const CELL_SIZE = 20;

          function render() {
            container.innerHTML = `
                    <div style="text-align:center;padding:5px 0;">
                        <div class="high-score-display">🏆 အကောင်းဆုံး: ${bestScore > 0 ? bestScore : "မရှိသေးဘူး"}</div>
                        <div style="font-size:14px;color:#aaa;margin:8px 0;">🏆 <span id="snakeScore">0</span></div>
                        <canvas id="snakeCanvas" width="${GRID_SIZE * CELL_SIZE}" height="${GRID_SIZE * CELL_SIZE}" 
                                style="border-radius:12px;background:#0f3460;border:2px solid #e94560;width:100%;max-width:360px;height:auto;"></canvas>
                        <div id="snakeMsg" style="margin-top:8px;font-size:16px;min-height:22px;color:#888;"></div>
                        <div style="display:flex;justify-content:center;gap:8px;margin-top:8px;">
                            <button onclick="window.snakeMove('up')" style="padding:6px 14px;background:#0f3460;border:1px solid #e94560;border-radius:8px;color:#fff;font-size:18px;cursor:pointer;">⬆</button>
                            <button onclick="window.snakeMove('left')" style="padding:6px 14px;background:#0f3460;border:1px solid #e94560;border-radius:8px;color:#fff;font-size:18px;cursor:pointer;">⬅</button>
                            <button onclick="window.snakeMove('down')" style="padding:6px 14px;background:#0f3460;border:1px solid #e94560;border-radius:8px;color:#fff;font-size:18px;cursor:pointer;">⬇</button>
                            <button onclick="window.snakeMove('right')" style="padding:6px 14px;background:#0f3460;border:1px solid #e94560;border-radius:8px;color:#fff;font-size:18px;cursor:pointer;">➡</button>
                        </div>
                        <button onclick="window.resetSnake()" 
                                style="margin-top:8px;padding:6px 20px;font-size:13px;font-weight:bold;background:#0f3460;color:#fff;border:1px solid #e94560;border-radius:10px;cursor:pointer;">
                            🔄 ပြန်စမယ်
                        </button>
                    </div>
                `;

            const canvas = document.getElementById("snakeCanvas");
            const ctx = canvas.getContext("2d");

            function draw() {
              ctx.fillStyle = "#0f3460";
              ctx.fillRect(0, 0, canvas.width, canvas.height);

              snake.forEach((seg, i) => {
                ctx.fillStyle = i === 0 ? "#4CAF50" : "#2E7D32";
                ctx.fillRect(
                  seg.x * CELL_SIZE + 1,
                  seg.y * CELL_SIZE + 1,
                  CELL_SIZE - 2,
                  CELL_SIZE - 2,
                );
              });

              ctx.fillStyle = "#e94560";
              ctx.beginPath();
              ctx.arc(
                food.x * CELL_SIZE + CELL_SIZE / 2,
                food.y * CELL_SIZE + CELL_SIZE / 2,
                CELL_SIZE / 2 - 2,
                0,
                Math.PI * 2,
              );
              ctx.fill();

              ctx.strokeStyle = "rgba(255,255,255,0.05)";
              ctx.lineWidth = 0.5;
              for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
              }
            }

            function update() {
              if (gameOver) return;

              direction = { ...nextDirection };

              const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y,
              };

              if (
                head.x < 0 ||
                head.x >= GRID_SIZE ||
                head.y < 0 ||
                head.y >= GRID_SIZE
              ) {
                gameOver = true;
                document.getElementById("snakeMsg").textContent =
                  "💀 Game Over!";
                document.getElementById("snakeMsg").style.color = "#ff6b6b";
                if (gameLoop) {
                  clearInterval(gameLoop);
                  gameLoop = null;
                }
                checkHighScore();
                return;
              }

              if (snake.some((seg) => seg.x === head.x && seg.y === head.y)) {
                gameOver = true;
                document.getElementById("snakeMsg").textContent =
                  "💀 Game Over!";
                document.getElementById("snakeMsg").style.color = "#ff6b6b";
                if (gameLoop) {
                  clearInterval(gameLoop);
                  gameLoop = null;
                }
                checkHighScore();
                return;
              }

              snake.unshift(head);

              if (head.x === food.x && head.y === food.y) {
                score++;
                document.getElementById("snakeScore").textContent = score;
                spawnFood();
              } else {
                snake.pop();
              }

              draw();
            }

            function checkHighScore() {
              const isNew = HighScoreManager.set(gameId, score);
              if (isNew) {
                document.querySelector(".high-score-display").textContent =
                  `🏆 အကောင်းဆုံး: ${score} (NEW!)`;
                document.querySelector(
                  ".high-score-display",
                ).style.borderColor = "#4CAF50";
                updateHighScoreBadges();
              } else {
                const best = HighScoreManager.get(gameId);
                document.querySelector(".high-score-display").textContent =
                  `🏆 အကောင်းဆုံး: ${best}`;
              }
            }

            function spawnFood() {
              let pos;
              do {
                pos = {
                  x: Math.floor(Math.random() * GRID_SIZE),
                  y: Math.floor(Math.random() * GRID_SIZE),
                };
              } while (snake.some((seg) => seg.x === pos.x && seg.y === pos.y));
              food = pos;
            }

            window.snakeMove = (dir) => {
              const dirs = {
                up: { x: 0, y: -1 },
                down: { x: 0, y: 1 },
                left: { x: -1, y: 0 },
                right: { x: 1, y: 0 },
              };
              const newDir = dirs[dir];
              if (
                newDir &&
                (newDir.x !== -direction.x || newDir.y !== -direction.y)
              ) {
                nextDirection = newDir;
              }
            };

            window.resetSnake = () => {
              if (gameLoop) {
                clearInterval(gameLoop);
                gameLoop = null;
              }
              snake = [{ x: 8, y: 8 }];
              direction = { x: 1, y: 0 };
              nextDirection = { x: 1, y: 0 };
              score = 0;
              gameOver = false;
              bestScore = HighScoreManager.get(gameId);
              document.getElementById("snakeScore").textContent = "0";
              document.getElementById("snakeMsg").textContent = "";
              document.querySelector(".high-score-display").textContent =
                `🏆 အကောင်းဆုံး: ${bestScore > 0 ? bestScore : "မရှိသေးဘူး"}`;
              document.querySelector(".high-score-display").style.borderColor =
                "rgba(255,217,61,0.2)";
              spawnFood();
              draw();
              gameLoop = setInterval(update, 120);
            };

            document.addEventListener(
              "keydown",
              (window._snakeKeyHandler = (e) => {
                const keyMap = {
                  ArrowUp: "up",
                  ArrowDown: "down",
                  ArrowLeft: "left",
                  ArrowRight: "right",
                };
                if (keyMap[e.key]) {
                  e.preventDefault();
                  window.snakeMove(keyMap[e.key]);
                }
              }),
            );

            spawnFood();
            draw();
            gameLoop = setInterval(update, 120);
          }

          render();
          return {
            cleanup: () => {
              if (gameLoop) {
                clearInterval(gameLoop);
                gameLoop = null;
              }
              if (window._snakeKeyHandler) {
                document.removeEventListener(
                  "keydown",
                  window._snakeKeyHandler,
                );
                delete window._snakeKeyHandler;
              }
              delete window.snakeMove;
              delete window.resetSnake;
            },
          };
        };
      }

      // GAME 8: Flappy Bird
      function flappyGame() {
        return function (container, gameId) {
          let bird = { x: 50, y: 150, vy: 0, size: 15 };
          let pipes = [];
          let score = 0;
          let gameOver = false;
          let gameLoop = null;
          let bestScore = HighScoreManager.get(gameId);
          const GRAVITY = 0.4;
          const JUMP = -6;
          const PIPE_WIDTH = 30;
          const PIPE_GAP = 120;
          const CANVAS_WIDTH = 300;
          const CANVAS_HEIGHT = 400;

          function render() {
            container.innerHTML = `
                    <div style="text-align:center;padding:5px 0;">
                        <div class="high-score-display">🏆 အကောင်းဆုံး: ${bestScore > 0 ? bestScore : "မရှိသေးဘူး"}</div>
                        <div style="font-size:16px;color:#fff;margin:8px 0;">🏆 <span id="flappyScore">0</span></div>
                        <canvas id="flappyCanvas" width="${CANVAS_WIDTH}" height="${CANVAS_HEIGHT}" 
                                style="border-radius:12px;background:#87CEEB;border:2px solid #e94560;width:100%;max-width:350px;height:auto;cursor:pointer;"></canvas>
                        <div id="flappyMsg" style="margin-top:8px;font-size:16px;min-height:22px;color:#888;"></div>
                        <button onclick="window.resetFlappy()" 
                                style="margin-top:8px;padding:8px 24px;font-size:14px;font-weight:bold;background:#0f3460;color:#fff;border:1px solid #e94560;border-radius:10px;cursor:pointer;">
                            🔄 ပြန်စမယ်
                        </button>
                    </div>
                `;

            const canvas = document.getElementById("flappyCanvas");
            const ctx = canvas.getContext("2d");

            canvas.addEventListener("click", () => {
              if (gameOver) return;
              bird.vy = JUMP;
            });
            canvas.addEventListener(
              "touchstart",
              (e) => {
                e.preventDefault();
                if (gameOver) return;
                bird.vy = JUMP;
              },
              { passive: false },
            );

            document.addEventListener(
              "keydown",
              (window._flappyKeyHandler = (e) => {
                if (e.key === " " || e.key === "ArrowUp") {
                  e.preventDefault();
                  if (gameOver) return;
                  bird.vy = JUMP;
                }
              }),
            );

            function resetGame() {
              bird = { x: 50, y: 150, vy: 0, size: 15 };
              pipes = [];
              score = 0;
              gameOver = false;
              document.getElementById("flappyScore").textContent = "0";
              document.getElementById("flappyMsg").textContent = "";
              bestScore = HighScoreManager.get(gameId);
              document.querySelector(".high-score-display").textContent =
                `🏆 အကောင်းဆုံး: ${bestScore > 0 ? bestScore : "မရှိသေးဘူး"}`;
              document.querySelector(".high-score-display").style.borderColor =
                "rgba(255,217,61,0.2)";
            }

            window.resetFlappy = () => {
              if (gameLoop) {
                cancelAnimationFrame(gameLoop);
                gameLoop = null;
              }
              resetGame();
              loop();
            };

            function draw() {
              ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

              const grad = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
              grad.addColorStop(0, "#4A90D9");
              grad.addColorStop(0.7, "#87CEEB");
              grad.addColorStop(1, "#B5D8A8");
              ctx.fillStyle = grad;
              ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

              ctx.fillStyle = "#7CB342";
              ctx.fillRect(0, CANVAS_HEIGHT - 30, CANVAS_WIDTH, 30);
              ctx.fillStyle = "#689F38";
              ctx.fillRect(0, CANVAS_HEIGHT - 30, CANVAS_WIDTH, 3);

              pipes.forEach((p) => {
                ctx.fillStyle = "#2E7D32";
                ctx.fillRect(p.x, 0, PIPE_WIDTH, p.top);
                ctx.fillRect(
                  p.x,
                  p.top + PIPE_GAP,
                  PIPE_WIDTH,
                  CANVAS_HEIGHT - p.top - PIPE_GAP,
                );
                ctx.fillStyle = "#388E3C";
                ctx.fillRect(p.x - 3, p.top - 15, PIPE_WIDTH + 6, 15);
                ctx.fillRect(p.x - 3, p.top + PIPE_GAP, PIPE_WIDTH + 6, 15);
              });

              ctx.fillStyle = "#FFD93D";
              ctx.beginPath();
              ctx.arc(bird.x, bird.y, bird.size, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = "#FF6B6B";
              ctx.beginPath();
              ctx.arc(bird.x + 6, bird.y - 4, 4, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = "#1a1a2e";
              ctx.beginPath();
              ctx.arc(bird.x + 8, bird.y - 5, 2, 0, Math.PI * 2);
              ctx.fill();

              ctx.fillStyle = "rgba(0,0,0,0.3)";
              ctx.fillRect(10, 10, 50, 30);
              ctx.fillStyle = "white";
              ctx.font = "bold 18px Arial";
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.fillText(score, 35, 27);

              if (gameOver) {
                ctx.fillStyle = "rgba(0,0,0,0.4)";
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                ctx.fillStyle = "white";
                ctx.font = "bold 30px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("💀", CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 10);
                ctx.font = "16px Arial";
                ctx.fillText(
                  "Game Over",
                  CANVAS_WIDTH / 2,
                  CANVAS_HEIGHT / 2 + 40,
                );
              }
            }

            function update() {
              if (gameOver) return;

              bird.vy += GRAVITY;
              bird.y += bird.vy;

              if (
                bird.y - bird.size < 0 ||
                bird.y + bird.size > CANVAS_HEIGHT - 30
              ) {
                gameOver = true;
                document.getElementById("flappyMsg").textContent =
                  "💀 Game Over!";
                document.getElementById("flappyMsg").style.color = "#ff6b6b";
                checkHighScore();
                return;
              }

              if (
                pipes.length === 0 ||
                pipes[pipes.length - 1].x < CANVAS_WIDTH - 150
              ) {
                const top =
                  30 + Math.random() * (CANVAS_HEIGHT - PIPE_GAP - 60);
                pipes.push({ x: CANVAS_WIDTH, top: top });
              }

              for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= 2;
                if (pipes[i].x + PIPE_WIDTH < 0) {
                  pipes.splice(i, 1);
                  continue;
                }

                if (!pipes[i].scored && pipes[i].x + PIPE_WIDTH < bird.x) {
                  pipes[i].scored = true;
                  score++;
                  document.getElementById("flappyScore").textContent = score;
                }

                const p = pipes[i];
                if (
                  bird.x + bird.size > p.x &&
                  bird.x - bird.size < p.x + PIPE_WIDTH
                ) {
                  if (
                    bird.y - bird.size < p.top ||
                    bird.y + bird.size > p.top + PIPE_GAP
                  ) {
                    gameOver = true;
                    document.getElementById("flappyMsg").textContent =
                      "💀 Game Over!";
                    document.getElementById("flappyMsg").style.color =
                      "#ff6b6b";
                    checkHighScore();
                    return;
                  }
                }
              }

              draw();
            }

            function checkHighScore() {
              const isNew = HighScoreManager.set(gameId, score);
              if (isNew) {
                document.querySelector(".high-score-display").textContent =
                  `🏆 အကောင်းဆုံး: ${score} (NEW!)`;
                document.querySelector(
                  ".high-score-display",
                ).style.borderColor = "#4CAF50";
                updateHighScoreBadges();
              } else {
                const best = HighScoreManager.get(gameId);
                document.querySelector(".high-score-display").textContent =
                  `🏆 အကောင်းဆုံး: ${best}`;
              }
            }

            function loop() {
              if (!gameOver) update();
              else draw();
              gameLoop = requestAnimationFrame(loop);
            }

            loop();
          }

          render();
          return {
            cleanup: () => {
              if (gameLoop) {
                cancelAnimationFrame(gameLoop);
                gameLoop = null;
              }
              if (window._flappyKeyHandler) {
                document.removeEventListener(
                  "keydown",
                  window._flappyKeyHandler,
                );
                delete window._flappyKeyHandler;
              }
              delete window.resetFlappy;
            },
          };
        };
      }

      // GAME 9: Dice Roll
      function diceGame() {
        return function (container, gameId) {
          let playerScore = 0;
          let computerScore = 0;
          let gameOver = false;
          let bestScore = HighScoreManager.get(gameId);
          let isRolling = false;
          let playerValue = 1;
          let computerValue = 1;
          let canvas = null;
          let ctx = null;

          function drawDice(ctx, x, y, size, value, isPlayer) {
            const dotRadius = size * 0.08;
            const margin = size * 0.12;
            const dotSize = size * 0.15;

            ctx.shadowColor = "rgba(0,0,0,0.3)";
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = 3;
            ctx.shadowOffsetY = 3;

            const gradient = ctx.createRadialGradient(
              x + size * 0.2,
              y + size * 0.2,
              size * 0.1,
              x + size * 0.5,
              y + size * 0.5,
              size * 0.6,
            );
            gradient.addColorStop(0, "#FFFFFF");
            gradient.addColorStop(0.7, "#F5F5F5");
            gradient.addColorStop(1, "#E0E0E0");

            ctx.fillStyle = gradient;
            ctx.shadowBlur = 15;
            ctx.shadowColor = "rgba(0,0,0,0.25)";

            const radius = size * 0.12;
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + size - radius, y);
            ctx.quadraticCurveTo(x + size, y, x + size, y + radius);
            ctx.lineTo(x + size, y + size - radius);
            ctx.quadraticCurveTo(
              x + size,
              y + size,
              x + size - radius,
              y + size,
            );
            ctx.lineTo(x + radius, y + size);
            ctx.quadraticCurveTo(x, y + size, x, y + size - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.strokeStyle = "#CCCCCC";
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.shadowBlur = 2;
            ctx.shadowColor = "rgba(0,0,0,0.2)";
            ctx.shadowOffsetX = 1;
            ctx.shadowOffsetY = 1;
            ctx.fillStyle = "#1a1a2e";

            const dotPositions = {
              1: [[0.5, 0.5]],
              2: [
                [0.25, 0.25],
                [0.75, 0.75],
              ],
              3: [
                [0.25, 0.25],
                [0.5, 0.5],
                [0.75, 0.75],
              ],
              4: [
                [0.25, 0.25],
                [0.75, 0.25],
                [0.25, 0.75],
                [0.75, 0.75],
              ],
              5: [
                [0.25, 0.25],
                [0.75, 0.25],
                [0.5, 0.5],
                [0.25, 0.75],
                [0.75, 0.75],
              ],
              6: [
                [0.25, 0.25],
                [0.75, 0.25],
                [0.25, 0.5],
                [0.75, 0.5],
                [0.25, 0.75],
                [0.75, 0.75],
              ],
            };

            const dots = dotPositions[value] || dotPositions[1];
            dots.forEach((pos) => {
              const dx = x + pos[0] * size;
              const dy = y + pos[1] * size;
              ctx.beginPath();
              ctx.arc(dx, dy, dotSize, 0, Math.PI * 2);
              ctx.fill();
            });

            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
          }

          function render() {
            container.innerHTML = `
                <div style="text-align:center;padding:5px 0;">
                    <div class="high-score-display">🏆 အနိုင်ရအကြိမ်ရေ: ${bestScore}</div>
                    <div style="display:flex;justify-content:center;gap:40px;margin:10px 0;">
                        <div>
                            <div style="font-size:14px;color:#4CAF50;font-weight:bold;">သင်</div>
                            <canvas id="playerDiceCanvas" width="120" height="120" 
                                    style="border-radius:12px;width:120px;height:120px;margin:5px auto;display:block;"></canvas>
                            <div style="font-size:24px;font-weight:bold;color:#4CAF50;" id="playerScore">0</div>
                        </div>
                        <div>
                            <div style="font-size:14px;color:#e94560;font-weight:bold;">ကွန်ပျူတာ</div>
                            <canvas id="computerDiceCanvas" width="120" height="120" 
                                    style="border-radius:12px;width:120px;height:120px;margin:5px auto;display:block;"></canvas>
                            <div style="font-size:24px;font-weight:bold;color:#e94560;" id="computerScore">0</div>
                        </div>
                    </div>
                    <div id="diceMsg" style="font-size:18px;min-height:28px;color:#ffd93d;"></div>
                    <div style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap;">
                        <button onclick="window.rollDice()" 
                                style="padding:12px 30px;font-size:18px;font-weight:bold;background:#e94560;color:#fff;border:none;border-radius:10px;cursor:pointer;touch-action:manipulation;">
                            🎲 လှိမ့်မယ်
                        </button>
                        <button onclick="window.resetDice()" 
                                style="padding:12px 24px;font-size:16px;font-weight:bold;background:#0f3460;color:#fff;border:1px solid #e94560;border-radius:10px;cursor:pointer;touch-action:manipulation;">
                            🔄 ပြန်စမယ်
                        </button>
                    </div>
                </div>
            `;

            canvas = document.getElementById("playerDiceCanvas");
            ctx = canvas.getContext("2d");
            drawDice(ctx, 0, 0, 120, 1, true);

            canvas = document.getElementById("computerDiceCanvas");
            ctx = canvas.getContext("2d");
            drawDice(ctx, 0, 0, 120, 1, false);

            window.rollDice = function () {
              if (gameOver || isRolling) return;
              isRolling = true;

              const playerRoll = Math.floor(Math.random() * 6) + 1;
              const computerRoll = Math.floor(Math.random() * 6) + 1;
              playerValue = playerRoll;
              computerValue = computerRoll;

              let frame = 0;
              const maxFrames = 8;
              const rollInterval = setInterval(() => {
                frame++;
                const randomP = Math.floor(Math.random() * 6) + 1;
                const randomC = Math.floor(Math.random() * 6) + 1;

                const pCanvas = document.getElementById("playerDiceCanvas");
                const pCtx = pCanvas.getContext("2d");
                drawDice(pCtx, 0, 0, 120, randomP, true);

                const cCanvas = document.getElementById("computerDiceCanvas");
                const cCtx = cCanvas.getContext("2d");
                drawDice(cCtx, 0, 0, 120, randomC, false);

                if (frame >= maxFrames) {
                  clearInterval(rollInterval);
                  const pCanvas2 = document.getElementById("playerDiceCanvas");
                  const pCtx2 = pCanvas2.getContext("2d");
                  drawDice(pCtx2, 0, 0, 120, playerRoll, true);

                  const cCanvas2 =
                    document.getElementById("computerDiceCanvas");
                  const cCtx2 = cCanvas2.getContext("2d");
                  drawDice(cCtx2, 0, 0, 120, computerRoll, false);

                  showResult(playerRoll, computerRoll);
                }
              }, 80);
            };

            function showResult(playerRoll, computerRoll) {
              const msg = document.getElementById("diceMsg");

              if (playerRoll > computerRoll) {
                playerScore++;
                document.getElementById("playerScore").textContent =
                  playerScore;
                msg.textContent = `🎉 သင် အနိုင်ရပြီ! (${playerRoll} vs ${computerRoll})`;
                msg.style.color = "#4CAF50";

                const isNew = HighScoreManager.set(gameId, playerScore);
                if (isNew) {
                  document.querySelector(".high-score-display").textContent =
                    `🏆 အနိုင်ရအကြိမ်ရေ: ${playerScore} (NEW!)`;
                  document.querySelector(
                    ".high-score-display",
                  ).style.borderColor = "#4CAF50";
                  updateHighScoreBadges();
                } else {
                  const best = HighScoreManager.get(gameId);
                  document.querySelector(".high-score-display").textContent =
                    `🏆 အနိုင်ရအကြိမ်ရေ: ${best}`;
                }
              } else if (computerRoll > playerRoll) {
                computerScore++;
                document.getElementById("computerScore").textContent =
                  computerScore;
                msg.textContent = `😅 ကွန်ပျူတာ အနိုင်ရတယ် (${playerRoll} vs ${computerRoll})`;
                msg.style.color = "#ff6b6b";
              } else {
                msg.textContent = `🤝 သရေကျတယ်! (${playerRoll} vs ${computerRoll})`;
                msg.style.color = "#ffd93d";
              }

              if (playerScore >= 5) {
                gameOver = true;
                msg.textContent = "🏆 သင်က ချန်ပီယံ!";
                msg.style.color = "#ffd93d";
              } else if (computerScore >= 5) {
                gameOver = true;
                msg.textContent = "💻 ကွန်ပျူတာက ချန်ပီယံ!";
                msg.style.color = "#ff6b6b";
              }

              isRolling = false;
            }

            window.resetDice = function () {
              playerScore = 0;
              computerScore = 0;
              gameOver = false;
              isRolling = false;
              playerValue = 1;
              computerValue = 1;
              bestScore = HighScoreManager.get(gameId);

              document.getElementById("playerScore").textContent = "0";
              document.getElementById("computerScore").textContent = "0";
              document.getElementById("diceMsg").textContent =
                "🔄 ဂိမ်းအသစ်စတင်ပြီ";
              document.getElementById("diceMsg").style.color = "#ffd93d";

              const pCanvas = document.getElementById("playerDiceCanvas");
              const pCtx = pCanvas.getContext("2d");
              drawDice(pCtx, 0, 0, 120, 1, true);

              const cCanvas = document.getElementById("computerDiceCanvas");
              const cCtx = cCanvas.getContext("2d");
              drawDice(cCtx, 0, 0, 120, 1, false);

              document.querySelector(".high-score-display").textContent =
                `🏆 အနိုင်ရအကြိမ်ရေ: ${bestScore}`;
              document.querySelector(".high-score-display").style.borderColor =
                "rgba(255,217,61,0.2)";
            };
          }

          render();

          return {
            cleanup: () => {
              delete window.rollDice;
              delete window.resetDice;
            },
          };
        };
      }

      // GAME 10: Rock Paper Scissors
      function rockPaperGame() {
        return function (container, gameId) {
          let playerScore = 0;
          let computerScore = 0;
          let bestScore = HighScoreManager.get(gameId);
          let gameOver = false;
          let roundActive = true;
          let isTransitioning = false;
          const choices = ["🪨", "📄", "✂️"];
          const names = ["Rock", "Paper", "Scissors"];

          function render() {
            if (gameOver) return;

            container.innerHTML = `
                <div style="text-align:center;padding:5px 0;">
                    <div class="high-score-display">🏆 အနိုင်ရအကြိမ်ရေ: ${bestScore}</div>
                    <div style="display:flex;justify-content:center;gap:30px;margin:10px 0;">
                        <div>
                            <div style="font-size:14px;color:#aaa;">သင်</div>
                            <div style="font-size:42px;" id="rpsPlayer">❓</div>
                            <div style="font-size:18px;color:#4CAF50;" id="rpsPlayerScore">${playerScore}</div>
                        </div>
                        <div>
                            <div style="font-size:14px;color:#aaa;">ကွန်ပျူတာ</div>
                            <div style="font-size:42px;" id="rpsComputer">❓</div>
                            <div style="font-size:18px;color:#e94560;" id="rpsComputerScore">${computerScore}</div>
                        </div>
                    </div>
                    <div id="rpsMsg" style="font-size:18px;min-height:28px;color:#ffd93d;"></div>
                    <div style="display:flex;justify-content:center;gap:12px;margin-top:10px;">
                        ${choices
                          .map(
                            (c, i) => `
                            <button class="rps-choice" data-index="${i}" 
                                    style="padding:12px 20px;font-size:28px;background:#0f3460;border:2px solid #e94560;border-radius:12px;cursor:pointer;transition:0.3s;touch-action:manipulation;">
                                ${c}
                            </button>
                        `,
                          )
                          .join("")}
                    </div>
                    <button onclick="window.resetRPS()" 
                            style="margin-top:12px;padding:8px 24px;font-size:14px;font-weight:bold;background:#0f3460;color:#fff;border:1px solid #e94560;border-radius:10px;cursor:pointer;display:none;" id="resetRPSBtn">
                        🔄 ပြန်စမယ်
                    </button>
                    <div id="rpsRoundInfo" style="margin-top:8px;font-size:14px;color:#888;"></div>
                </div>
            `;

            roundActive = true;

            document.querySelectorAll(".rps-choice").forEach((el) => {
              el.addEventListener("click", function () {
                if (gameOver || !roundActive || isTransitioning) return;
                const playerIndex = parseInt(this.dataset.index);
                playRound(playerIndex);
              });
            });

            window.resetRPS = () => {
              playerScore = 0;
              computerScore = 0;
              gameOver = false;
              roundActive = true;
              isTransitioning = false;
              bestScore = HighScoreManager.get(gameId);
              document.getElementById("rpsPlayer").textContent = "❓";
              document.getElementById("rpsComputer").textContent = "❓";
              document.getElementById("rpsPlayerScore").textContent = "0";
              document.getElementById("rpsComputerScore").textContent = "0";
              document.getElementById("rpsMsg").textContent =
                "🔄 ဂိမ်းအသစ်စတင်ပြီ";
              document.getElementById("rpsMsg").style.color = "#ffd93d";
              document.querySelector(".high-score-display").textContent =
                `🏆 အနိုင်ရအကြိမ်ရေ: ${bestScore}`;
              document.querySelector(".high-score-display").style.borderColor =
                "rgba(255,217,61,0.2)";
              document.getElementById("resetRPSBtn").style.display = "none";
              document.getElementById("rpsRoundInfo").textContent = "";
              document.querySelectorAll(".rps-choice").forEach((el) => {
                el.style.pointerEvents = "auto";
                el.style.opacity = "1";
              });
              render();
            };
          }

          function playRound(playerIndex) {
            const computerIndex = Math.floor(Math.random() * 3);

            document.querySelectorAll(".rps-choice").forEach((el) => {
              el.style.pointerEvents = "none";
              el.style.opacity = "0.6";
            });

            document.getElementById("rpsPlayer").textContent =
              choices[playerIndex];
            document.getElementById("rpsComputer").textContent =
              choices[computerIndex];

            document.querySelectorAll(".rps-choice").forEach((el) => {
              const idx = parseInt(el.dataset.index);
              if (idx === playerIndex) {
                el.style.borderColor = "#4CAF50";
                el.style.boxShadow = "0 0 20px rgba(76,175,80,0.3)";
              }
            });

            let resultMsg = "";
            let resultColor = "#ffd93d";
            let won = false;

            if (playerIndex === computerIndex) {
              resultMsg = `🤝 သရေကျတယ်! (${names[playerIndex]} vs ${names[computerIndex]})`;
              resultColor = "#ffd93d";
            } else if (
              (playerIndex === 0 && computerIndex === 2) ||
              (playerIndex === 1 && computerIndex === 0) ||
              (playerIndex === 2 && computerIndex === 1)
            ) {
              playerScore++;
              won = true;
              resultMsg = `🎉 သင် အနိုင်ရပြီ! (${names[playerIndex]} vs ${names[computerIndex]})`;
              resultColor = "#4CAF50";

              const isNew = HighScoreManager.set(gameId, playerScore);
              if (isNew) {
                document.querySelector(".high-score-display").textContent =
                  `🏆 အနိုင်ရအကြိမ်ရေ: ${playerScore} (NEW!)`;
                document.querySelector(
                  ".high-score-display",
                ).style.borderColor = "#4CAF50";
                updateHighScoreBadges();
              } else {
                const best = HighScoreManager.get(gameId);
                document.querySelector(".high-score-display").textContent =
                  `🏆 အနိုင်ရအကြိမ်ရေ: ${best}`;
              }
            } else {
              computerScore++;
              gameOver = true;
              roundActive = false;
              resultMsg = `😅 ကွန်ပျူတာ အနိုင်ရတယ် (${names[playerIndex]} vs ${names[computerIndex]})`;
              resultColor = "#ff6b6b";

              document.getElementById("resetRPSBtn").style.display =
                "inline-block";
              document.getElementById("rpsRoundInfo").textContent =
                "💀 Game Over! ပြန်စရန် နှိပ်ပါ";
              document.getElementById("rpsRoundInfo").style.color = "#ff6b6b";
            }

            document.getElementById("rpsMsg").textContent = resultMsg;
            document.getElementById("rpsMsg").style.color = resultColor;
            document.getElementById("rpsPlayerScore").textContent = playerScore;
            document.getElementById("rpsComputerScore").textContent =
              computerScore;

            if (!gameOver) {
              document.getElementById("rpsRoundInfo").textContent =
                "🔄 နောက်တစ်ပွဲအတွက် စောင့်ပါ...";
              document.getElementById("rpsRoundInfo").style.color = "#888";

              setTimeout(() => {
                document.getElementById("rpsPlayer").textContent = "❓";
                document.getElementById("rpsComputer").textContent = "❓";
                document.getElementById("rpsMsg").textContent = "";
                document.getElementById("rpsRoundInfo").textContent = "";

                document.querySelectorAll(".rps-choice").forEach((el) => {
                  el.style.borderColor = "#e94560";
                  el.style.boxShadow = "none";
                  el.style.pointerEvents = "auto";
                  el.style.opacity = "1";
                });

                roundActive = true;
              }, 1200);
            } else {
              document.querySelectorAll(".rps-choice").forEach((el) => {
                el.style.borderColor = "#ff6b6b";
                el.style.pointerEvents = "none";
                el.style.opacity = "0.5";
              });
            }
          }

          render();
          return {
            cleanup: () => {
              delete window.resetRPS;
            },
          };
        };
      }

      // GAME 13: Pizza Chef

                difficulty: 1,

                name: "Mushroom",
                ingredients: ["cheese", "mushroom", "onion"],
                emoji: "🍄",
                difficulty: 1,
              },
              {
                name: "Hawaiian",
                ingredients: ["cheese", "pineapple", "bacon"],
                emoji: "🍍",
                difficulty: 2,
              },
              {
                name: "Supreme",
                ingredients: [
                  "cheese",
                  "pepperoni",
                  "mushroom",
                  "onion",
                  "bellpepper",
                ],
                emoji: "⭐",
                difficulty: 2,

                  "bellpepper",
                  "olive",

                emoji: "🥗",

              {

                ingredients: ["cheese", "bacon", "onion", "bellpepper"],
                emoji: "🔥",
                difficulty: 2,
              },
              {
                name: "Cheese ×3",
                ingredients: ["cheese", "cheese", "cheese"],
                emoji: "🧀🧀🧀",
                difficulty: 3,
              },
            ];

            if (level <= 2) {
              return baseRecipes.filter((r) => r.difficulty === 1);
            } else if (level <= 4) {
              return baseRecipes.filter((r) => r.difficulty <= 2);
            } else {
              return baseRecipes;
            }
          }

          function generateOrder() {
            const available = getRecipesForLevel(level);
            const recipe =

            selected = [];
            return recipe;

              bestScore = HighScoreManager.get(gameId);
              document.querySelector(".high-score-display").textContent =
                `🏆 အကောင်းဆုံး: ${bestScore > 0 ? bestScore : "မရှိသေးဘူး"}`;
              document.querySelector(".high-score-display").style.borderColor =
                "rgba(255,217,61,0.2)";

              startGame();
            };

            startGame();
          }

          function toggleIngredient(id) {
            if (!gameRunning) return;
            const index = selected.indexOf(id);
            if (index === -1) {
              selected.push(id);
            } else {
              selected.splice(index, 1);
            }
            updateSelectedDisplay();
            updateButtons();
          }

          function updateSelectedDisplay() {
            const el = document.getElementById("selectedIngredients");
            if (!el) return;
            if (selected.length === 0) {
              el.textContent = "(ဘာမှမရွေးရသေးဘူး)";
              el.style.color = "#888";
              return;
            }
            el.innerHTML = selected
              .map((id) => {
                const ing = INGREDIENTS.find((i) => i.id === id);
                return ing ? ing.name : id;
              })
              .join(" + ");
            el.style.color = "#ffd93d";
          }

          function updateButtons() {
            document.querySelectorAll(".ingredient-btn").forEach((btn) => {
              const id = btn.dataset.id;
              const count = selected.filter((s) => s === id).length;
              const ing = INGREDIENTS.find((i) => i.id === id);
              if (count > 0) {
                btn.style.borderColor = "#4CAF50";
                btn.style.background = "#1a4a2a";
                btn.textContent = `${ing.name} ×${count}`;
              } else {
                btn.style.borderColor = "#2a2a4a";
                btn.style.background = "#0f3460";
                btn.textContent = ing.name;
              }
            });
          }

          function checkPizza() {
            if (!gameRunning) return;

            const msg = document.getElementById("pizzaMsg");
            const required = currentRecipe.ingredients;

            const sortedRequired = [...required].sort();
            const sortedSelected = [...selected].sort();

            const exactMatch =
              sortedRequired.length === sortedSelected.length &&
              sortedRequired.every((val, i) => val === sortedSelected[i]);

            if (exactMatch) {
              correctCount++;
              const bonus = Math.floor(level / 2) * 2;
              const points = 10 + bonus;
              score += points;
              orderCount++;

              document.getElementById("pizzaScore").textContent = score;
              document.getElementById("correctCount").textContent =
                correctCount;

              msg.textContent = `✅ ပီဇာမှန်ပါတယ်! +${points} မှတ်`;
              msg.style.color = "#4CAF50";

              if (score >= level * 15) {
                level++;
                document.getElementById("pizzaLevel").textContent = level;
                msg.textContent = `🎉 Level ${level} ရောက်ပြီ! ပိုခက်ခဲလာမယ်!`;
                msg.style.color = "#ffd93d";
                timeLeft += 5;
                document.getElementById("pizzaTimer").textContent = timeLeft;
              }

              const isNew = HighScoreManager.set(gameId, score);
              if (isNew) {
                document.querySelector(".high-score-display").textContent =
                  `🏆 အကောင်းဆုံး: ${score} (NEW!)`;
                document.querySelector(
                  ".high-score-display",
                ).style.borderColor = "#4CAF50";
                updateHighScoreBadges();
              } else {
                const best = HighScoreManager.get(gameId);
                document.querySelector(".high-score-display").textContent =
                  `🏆 အကောင်းဆုံး: ${best}`;
              }

              setTimeout(() => {
                currentRecipe = generateOrder();
                selected = [];
                updateSelectedDisplay();
                updateButtons();

                document.getElementById("orderDisplay").textContent =
                  `${currentRecipe.emoji} ${currentRecipe.name}`;
                document.getElementById("orderIngredients").textContent =
                  `လိုအပ်တဲ့ပစ္စည်းများ: ${currentRecipe.ingredients
                    .map((id) => {
                      const ing = INGREDIENTS.find((i) => i.id === id);
                      return ing ? ing.name : id;
                    })
                    .join(", ")}`;

                msg.textContent = "📋 နောက်အော်ဒါအသစ်!";
                msg.style.color = "#ffd93d";
              }, 1000);
            } else {
              wrongCount++;
              document.getElementById("wrongCount").textContent = wrongCount;

              let errorMsg = "";
              const missing = required.filter((id) => !selected.includes(id));
              const extra = selected.filter((id) => !required.includes(id));

              if (missing.length > 0) {
                errorMsg += ` လိုတဲ့ပစ္စည်း: ${missing
                  .map((id) => {
                    const ing = INGREDIENTS.find((i) => i.id === id);
                    return ing ? ing.name : id;
                  })
                  .join(", ")}`;
              }
              if (extra.length > 0) {
                errorMsg += ` မလိုတဲ့ပစ္စည်း: ${extra
                  .map((id) => {
                    const ing = INGREDIENTS.find((i) => i.id === id);
                    return ing ? ing.name : id;
                  })
                  .join(", ")}`;
              }
              if (
                selected.length !== required.length &&
                missing.length === 0 &&
                extra.length === 0
              ) {
                errorMsg = ` ပစ္စည်းအရေအတွက် မှားနေတယ် (လိုတာ ${required.length} ခု၊ ရွေးတာ ${selected.length} ခု)`;
              }

              msg.textContent = `❌ မှားသွားတယ်!${errorMsg}`;
              msg.style.color = "#ff6b6b";

              setTimeout(() => {
                currentRecipe = generateOrder();
                selected = [];
                updateSelectedDisplay();
                updateButtons();

                document.getElementById("orderDisplay").textContent =
                  `${currentRecipe.emoji} ${currentRecipe.name}`;
                document.getElementById("orderIngredients").textContent =
                  `လိုအပ်တဲ့ပစ္စည်းများ: ${currentRecipe.ingredients
                    .map((id) => {
                      const ing = INGREDIENTS.find((i) => i.id === id);
                      return ing ? ing.name : id;
                    })
                    .join(", ")}`;

                msg.textContent = "📋 အော်ဒါအသစ်! ထပ်ကြိုးစားပါ";
                msg.style.color = "#ffd93d";
              }, 1500);
            }
          }

          function startGame() {
            gameRunning = true;
            timeLeft = 45;

            const timerEl = document.getElementById("pizzaTimer");
            if (timerEl) timerEl.textContent = "45";

            if (timerInterval) {
              clearInterval(timerInterval);
              timerInterval = null;
            }

            timerInterval = setInterval(() => {
              timeLeft--;
              const timerEl2 = document.getElementById("pizzaTimer");
              if (timerEl2) timerEl2.textContent = timeLeft;

              if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timerInterval = null;
                gameRunning = false;

                const msg = document.getElementById("pizzaMsg");
                if (msg) {
                  msg.textContent = `⏰ အချိန်ကုန်ပြီ! ရမှတ်: ${score}`;
                  msg.style.color = "#ff6b6b";
                }

                const isNew = HighScoreManager.set(gameId, score);
                const hsDisplay = document.querySelector(".high-score-display");
                if (hsDisplay) {
                  if (isNew) {
                    hsDisplay.textContent = `🏆 အကောင်းဆုံး: ${score} (NEW!)`;
                    hsDisplay.style.borderColor = "#4CAF50";
                    updateHighScoreBadges();
                  } else {
                    const best = HighScoreManager.get(gameId);
                    hsDisplay.textContent = `🏆 အကောင်းဆုံး: ${best}`;
                  }
                }

                document.querySelectorAll(".ingredient-btn").forEach((btn) => {
                  btn.style.pointerEvents = "none";
                  btn.style.opacity = "0.5";
                });
              }
            }, 1000);
          }

          render();

          return {
            cleanup: () => {
              if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
              }
              delete window.submitPizza;
              delete window.resetPizza;
            },
          };
        };
      }

      // GAME 14: Whack-a-Mole
      function whackMoleGame() {
        return function (container, gameId) {
          let score = 0;
          let level = 1;
          let timeLeft = 30;
          let gameRunning = false;
          let bestScore = HighScoreManager.get(gameId);
          let activeHole = -1;
          let hitCount = 0;
          let missCount = 0;
          let combo = 0;
          let maxCombo = 0;

          let gameLoop = null;
          let timerInterval = null;
          let canvas = null;
          let ctx = null;

          const HOLES = [
            { x: 15, y: 80 },
            { x: 95, y: 80 },
            { x: 175, y: 80 },
            { x: 15, y: 180 },
            { x: 95, y: 180 },
            { x: 175, y: 180 },
          ];

          const HOLE_WIDTH = 70;
          const HOLE_HEIGHT = 45;

          function drawHoles() {
            HOLES.forEach((hole) => {
              ctx.fillStyle = "#0f0f1a";
              ctx.shadowColor = "rgba(0,0,0,0.3)";
              ctx.shadowBlur = 10;
              ctx.beginPath();
              ctx.ellipse(
                hole.x + HOLE_WIDTH / 2,
                hole.y + HOLE_HEIGHT / 2,
                HOLE_WIDTH / 2,
                HOLE_HEIGHT / 2.5,
                0,
                0,
                Math.PI * 2,
              );
              ctx.fill();
              ctx.shadowBlur = 0;

              ctx.fillStyle = "#5D4037";
              ctx.beginPath();
              ctx.ellipse(
                hole.x + HOLE_WIDTH / 2,
                hole.y + HOLE_HEIGHT / 2 + 2,
                HOLE_WIDTH / 2 + 4,
                HOLE_HEIGHT / 2.5 + 3,
                0,
                0,
                Math.PI,
              );
              ctx.fill();

              ctx.fillStyle = "rgba(0,0,0,0.2)";
              ctx.beginPath();
              ctx.ellipse(
                hole.x + HOLE_WIDTH / 2,
                hole.y + HOLE_HEIGHT / 2 + 3,
                HOLE_WIDTH / 2 - 5,
                HOLE_HEIGHT / 2.5 - 3,
                0,
                0,
                Math.PI * 2,
              );
              ctx.fill();
            });
          }

          function drawHead(x, y) {
            const cx = x + HOLE_WIDTH / 2;
            const cy = y + HOLE_HEIGHT / 2 - 15;

            ctx.fillStyle = "rgba(0,0,0,0.15)";
            ctx.beginPath();
            ctx.ellipse(cx, cy + 22, 28, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#F5D6A8";
            ctx.shadowColor = "rgba(0,0,0,0.2)";
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.ellipse(cx, cy, 32, 26, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = "#0f0f1a";
            ctx.beginPath();
            ctx.ellipse(cx, cy + 22, 30, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#D4A373";
            ctx.shadowBlur = 4;
            ctx.beginPath();
            ctx.ellipse(cx - 26, cy - 4, 8, 16, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cx + 26, cy - 4, 8, 16, 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = "white";
            ctx.beginPath();
            ctx.ellipse(cx - 10, cy - 2, 10, 8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cx + 10, cy - 2, 10, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#1a1a2e";
            ctx.beginPath();
            ctx.arc(cx - 8, cy - 1, 4.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx + 12, cy - 1, 4.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "white";
            ctx.beginPath();
            ctx.arc(cx - 9, cy - 3, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx + 11, cy - 3, 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "#5D4037";
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(cx - 16, cy - 12);
            ctx.lineTo(cx - 6, cy - 14);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(cx + 6, cy - 14);
            ctx.lineTo(cx + 16, cy - 12);
            ctx.stroke();

            ctx.fillStyle = "#8B6B4A";
            ctx.beginPath();
            ctx.ellipse(cx, cy + 8, 10, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#2a1a0e";
            ctx.beginPath();
            ctx.arc(cx - 3.5, cy + 8, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx + 3.5, cy + 8, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "#5D4037";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(cx, cy + 15, 7, 0.1, 0.6);
            ctx.stroke();

            ctx.fillStyle = "rgba(255,150,150,0.25)";
            ctx.beginPath();
            ctx.arc(cx - 19, cy + 8, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx + 19, cy + 8, 8, 0, Math.PI * 2);
            ctx.fill();
          }

          function drawCapybaraWithHammer() {
            const cx = 150;
            const cy = 265;

            ctx.shadowColor = "rgba(0,0,0,0.2)";
            ctx.shadowBlur = 10;

            ctx.fillStyle = "#C68E4E";
            ctx.beginPath();
            ctx.ellipse(cx, cy + 10, 35, 22, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#B87D3A";
            ctx.fillRect(cx - 20, cy + 28, 10, 12);
            ctx.fillRect(cx + 10, cy + 28, 10, 12);
            ctx.fillRect(cx - 30, cy + 26, 10, 14);
            ctx.fillRect(cx + 20, cy + 26, 10, 14);

            ctx.fillStyle = "#D7A05B";
            ctx.beginPath();
            ctx.ellipse(cx + 22, cy - 2, 20, 17, 0.1, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#C68E4E";
            ctx.beginPath();
            ctx.ellipse(cx + 12, cy - 18, 6, 10, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cx + 28, cy - 18, 6, 10, 0.3, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;

            ctx.fillStyle = "white";
            ctx.beginPath();
            ctx.arc(cx + 26, cy - 6, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx + 34, cy - 6, 7, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#1a1a2e";
            ctx.beginPath();
            ctx.arc(cx + 27, cy - 7, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx + 35, cy - 7, 3.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#6B4F3A";
            ctx.beginPath();
            ctx.ellipse(cx + 38, cy + 1, 7, 5, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "#5D4037";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(cx + 36, cy + 7, 5, 0.1, 0.5);
            ctx.stroke();

            ctx.shadowBlur = 6;
            ctx.strokeStyle = "#8B6B4A";
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(cx + 6, cy + 14);
            ctx.lineTo(cx + 32, cy - 28);
            ctx.stroke();

            ctx.fillStyle = "#777";
            ctx.shadowBlur = 8;
            ctx.fillRect(cx + 26, cy - 38, 20, 12);
            ctx.fillStyle = "#999";
            ctx.fillRect(cx + 29, cy - 35, 14, 6);
            ctx.fillStyle = "#555";
            ctx.fillRect(cx + 28, cy - 36, 2, 8);
            ctx.fillRect(cx + 42, cy - 36, 2, 8);

            ctx.shadowBlur = 0;

            ctx.fillStyle = "#FF6B6B";
            for (let i = 0; i < 5; i++) {
              const angle = (i * Math.PI * 2) / 5 + 0.2;
              ctx.beginPath();
              ctx.ellipse(
                cx - 2 + Math.cos(angle) * 10,
                cy - 10 + Math.sin(angle) * 6,
                4,
                3,
                angle,
                0,
                Math.PI * 2,
              );
              ctx.fill();
            }
            ctx.fillStyle = "#FFD93D";
            ctx.beginPath();
            ctx.arc(cx - 2, cy - 10, 3, 0, Math.PI * 2);
            ctx.fill();
          }

          function draw() {
            if (!ctx) return;

            ctx.clearRect(0, 0, 300, 300);

            const grad = ctx.createLinearGradient(0, 0, 0, 300);
            grad.addColorStop(0, "#4CAF50");
            grad.addColorStop(0.2, "#388E3C");
            grad.addColorStop(1, "#2E7D32");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 300, 300);

            for (let i = 0; i < 15; i++) {
              ctx.fillStyle = i % 2 === 0 ? "#43A047" : "#388E3C";
              const gx = (i * 22 + Date.now() * 0.01) % 300;
              ctx.beginPath();
              ctx.moveTo(gx, 300);
              ctx.lineTo(gx + 4, 280 + Math.sin(i) * 4);
              ctx.lineTo(gx + 8, 300);
              ctx.closePath();
              ctx.fill();
            }

            drawHoles();

            if (gameRunning && activeHole >= 0 && activeHole < HOLES.length) {
              drawHead(HOLES[activeHole].x, HOLES[activeHole].y);
            }

            drawCapybaraWithHammer();
          }

          function showHead() {
            if (!gameRunning || timeLeft <= 0) return;

            if (activeHole !== -1) return;

            const randomHole = Math.floor(Math.random() * HOLES.length);
            activeHole = randomHole;
            draw();

            const hideDelay = Math.max(300, 800 - (level - 1) * 40);
            setTimeout(() => {
              if (gameRunning) {
                activeHole = -1;
                draw();
              }
            }, hideDelay);
          }

          function startGame() {
            score = 0;
            level = 1;
            timeLeft = 30;
            gameRunning = true;
            hitCount = 0;
            missCount = 0;
            combo = 0;
            maxCombo = 0;
            activeHole = -1;

            document.getElementById("moleScore").textContent = "0";
            document.getElementById("moleLevel").textContent = "1";
            document.getElementById("moleTimer").textContent = "30";
            document.getElementById("moleMsg").textContent =
              "🎮 စတင်ပါပြီ! ခေါင်းကို ရိုက်ပါ!";
            document.getElementById("moleMsg").style.color = "#ffd93d";
            document.getElementById("moleCombo").textContent = "0";
            document.getElementById("moleMaxCombo").textContent = "0";

            draw();

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
              timeLeft--;
              document.getElementById("moleTimer").textContent = timeLeft;
              if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timerInterval = null;
                endGame();
              }
            }, 1000);

            if (gameLoop) clearInterval(gameLoop);

            setTimeout(() => {
              if (gameRunning) showHead();
            }, 1000);

            gameLoop = setInterval(() => {
              if (!gameRunning || timeLeft <= 0) return;

              if (score >= level * 15) {
                level++;
                document.getElementById("moleLevel").textContent = level;
                document.getElementById("moleMsg").textContent =
                  `📊 Level ${level} ရောက်ပြီ! ပိုမြန်လာပြီ!`;
                document.getElementById("moleMsg").style.color = "#4CAF50";
              }

              if (activeHole === -1) {
                const delay = Math.max(300, 1200 - (level - 1) * 80);
                setTimeout(
                  () => {
                    if (gameRunning && activeHole === -1) {
                      showHead();
                    }
                  },
                  delay + Math.random() * 300,
                );
              }
            }, 200);
          }

          function endGame() {
            gameRunning = false;
            activeHole = -1;
            if (timerInterval) clearInterval(timerInterval);
            if (gameLoop) clearInterval(gameLoop);

            document.getElementById("moleMsg").textContent =
              `⏰ အချိန်ကုန်ပြီ! ရမှတ်: ${score}`;
            document.getElementById("moleMsg").style.color = "#ff6b6b";

            const isNew = HighScoreManager.set(gameId, score);
            if (isNew) {
              document.querySelector(".high-score-display").textContent =
                `🏆 အကောင်းဆုံး: ${score} (NEW!)`;
              document.querySelector(".high-score-display").style.borderColor =
                "#4CAF50";
              updateHighScoreBadges();
            } else {
              const best = HighScoreManager.get(gameId);
              document.querySelector(".high-score-display").textContent =
                `🏆 အကောင်းဆုံး: ${best}`;
            }

            draw();
          }

          function handleClick(e) {
            if (!gameRunning || timeLeft <= 0 || !canvas) return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            let clientX, clientY;
            if (e.touches) {
              clientX = e.touches[0].clientX;
              clientY = e.touches[0].clientY;
              e.preventDefault();
            } else {
              clientX = e.clientX;
              clientY = e.clientY;
            }

            const clickX = (clientX - rect.left) * scaleX;
            const clickY = (clientY - rect.top) * scaleY;

            let hitHole = -1;
            HOLES.forEach((hole, index) => {
              const hx = hole.x + HOLE_WIDTH / 2;
              const hy = hole.y + HOLE_HEIGHT / 2;
              const dx = clickX - hx;
              const dy = clickY - hy;
              if (Math.sqrt(dx * dx + dy * dy) < HOLE_WIDTH / 2 + 5) {
                hitHole = index;
              }
            });

            if (hitHole >= 0) {
              const msgEl = document.getElementById("moleMsg");
              if (hitHole === activeHole) {
                const bonus = Math.floor(level / 2) * 2;
                const points = 10 + bonus;
                score += points;
                hitCount++;
                combo++;
                if (combo > maxCombo) maxCombo = combo;

                document.getElementById("moleScore").textContent = score;
                document.getElementById("moleCombo").textContent = combo;
                document.getElementById("moleMaxCombo").textContent = maxCombo;

                if (msgEl) {
                  msgEl.textContent = `💥 ရိုက်မှန်ပြီ! +${points} (Combo x${combo})`;
                  msgEl.style.color = "#4CAF50";
                }

                activeHole = -1;
                draw();
              } else {
                missCount++;
                combo = 0;
                document.getElementById("moleCombo").textContent = "0";
                if (msgEl) {
                  msgEl.textContent = "😅 လွဲသွားတယ်!";
                  msgEl.style.color = "#ff6b6b";
                }
              }
            }
          }

          function render() {
            container.innerHTML = `
                <div style="text-align:center;padding:5px 0;">
                    <div class="high-score-display">🏆 အကောင်းဆုံး: ${bestScore > 0 ? bestScore : "မရှိသေးဘူး"}</div>
                    <div style="display:flex;justify-content:center;gap:15px;font-size:13px;color:#aaa;margin:6px 0;flex-wrap:wrap;">

                setTimeout(() => checkComputerSpecial(), 600);
              } else if (special.type === 4) {
                computerPosition = special.to;
                document.getElementById("computerPosDisplay").textContent =
                  computerPosition;
                document.getElementById("boardMsg").textContent =
                  `🤖 ကျော်သွားပြီ! ${special.to} ကိုရောက်သွားပြီ!`;
                document.getElementById("boardMsg").style.color = "#FFD93D";
                drawBoard();
                setTimeout(() => checkComputerSpecial(), 600);
              } else if (special.type === 5) {
                computerSkipTurn = true;
                document.getElementById("boardMsg").textContent =
                  `🤖 နားရမယ့်ကွက်! ကျော်သွားပါမယ်!`;
                document.getElementById("boardMsg").style.color = "#4A90D9";
                drawBoard();
                currentPlayer = "player";
                isRolling = false;
                document.getElementById("boardMsg").textContent =
                  "👤 သင့်အလှည့်ပါ! လှိမ့်လိုက်ပါ";
                document.getElementById("boardMsg").style.color = "#ffd93d";
              }
            }

            function drawBoard(diceValueToShow) {
              if (!ctx) return;

              const W = 1800;
              const H = 1200;
              const cols = 8;
              const rows = 6;
              const cellSize = 270;
              const boardStartX = 20;
              const boardStartY = 15;
              const padding = 4;

              ctx.clearRect(0, 0, W, H);
              ctx.fillStyle = "#0f3460";
              ctx.fillRect(0, 0, W, H);

              for (let i = 0; i < boardSize; i++) {
                const row = Math.floor(i / cols);
                const col = i % cols;
                const x = boardStartX + col * cellSize + padding;
                const y = boardStartY + row * cellSize + 40;
                const size = cellSize - padding * 2;

                const isSpecial = getSpecial(i + 1);

                if (isSpecial) {
                  ctx.fillStyle = isSpecial.color || "#2a2a4a";
                } else {
                  ctx.fillStyle = i % 2 === 0 ? "#1a4a7a" : "#1a5a8a";
                }

                ctx.fillRect(x, y, size, size);
                ctx.strokeStyle = "rgba(255,255,255,0.1)";
                ctx.lineWidth = 0.5;
                ctx.strokeRect(x, y, size, size);

                ctx.fillStyle = "rgba(255,255,255,0.4)";
                ctx.font = "bold 16px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(i + 1, x + size / 2, y + size / 2 - 10);

                if (isSpecial) {
                  ctx.fillStyle = "white";
                  ctx.font = "bold 22px Arial";
                  ctx.fillText(
                    isSpecial.label,
                    x + size / 2,
                    y + size / 2 + 14,
                  );
                }
              }

              const startX = boardStartX;
              const startY = boardStartY + rows * cellSize + 15;
              const startW = cols * cellSize;
              const startH = 158;

              ctx.fillStyle = "#2E86C1";
              ctx.shadowColor = "rgba(0,0,0,0.3)";
              ctx.shadowBlur = 10;
              ctx.beginPath();
              ctx.roundRect(startX, startY, startW, startH, 10);
              ctx.fill();
              ctx.shadowBlur = 0;
              ctx.strokeStyle = "rgba(255,215,0,0.4)";
              ctx.lineWidth = 2;
              ctx.setLineDash([5, 5]);
              ctx.beginPath();
              ctx.roundRect(startX, startY, startW, startH, 10);
              ctx.stroke();
              ctx.setLineDash([]);

              ctx.fillStyle = "#FFD93D";
              ctx.font = "bold 34px Arial";
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.fillText(
                "🏁 START",
                startX + startW / 2 - 100,
                startY + startH / 2,
              );

              const diceSize = 110;
              const diceX = startX + startW - diceSize - 40;
              const diceY = startY + (startH - diceSize) / 2;
              const val = diceValueToShow || diceValue || 1;

              ctx.shadowColor = "rgba(0,0,0,0.3)";
              ctx.shadowBlur = 15;
              ctx.shadowOffsetX = 3;
              ctx.shadowOffsetY = 3;

              const grad = ctx.createRadialGradient(
                diceX + diceSize * 0.2,
                diceY + diceSize * 0.2,
                diceSize * 0.1,
                diceX + diceSize * 0.5,
                diceY + diceSize * 0.5,
                diceSize * 0.6,
              );
              grad.addColorStop(0, "#FFFFFF");
              grad.addColorStop(0.7, "#F5F5F5");
              grad.addColorStop(1, "#E0E0E0");
              ctx.fillStyle = grad;

              const radius = diceSize * 0.12;
              ctx.beginPath();
              ctx.moveTo(diceX + radius, diceY);
              ctx.lineTo(diceX + diceSize - radius, diceY);
              ctx.quadraticCurveTo(
                diceX + diceSize,
                diceY,
                diceX + diceSize,
                diceY + radius,
              );
              ctx.lineTo(diceX + diceSize, diceY + diceSize - radius);
              ctx.quadraticCurveTo(
                diceX + diceSize,
                diceY + diceSize,
                diceX + diceSize - radius,
                diceY + diceSize,
              );
              ctx.lineTo(diceX + radius, diceY + diceSize);
              ctx.quadraticCurveTo(
                diceX,
                diceY + diceSize,
                diceX,
                diceY + diceSize - radius,
              );
              ctx.lineTo(diceX, diceY + radius);
              ctx.quadraticCurveTo(diceX, diceY, diceX + radius, diceY);
              ctx.closePath();
              ctx.fill();
              ctx.shadowBlur = 0;
              ctx.strokeStyle = "#CCCCCC";
              ctx.lineWidth = 1.5;
              ctx.stroke();

              const dotPositions = {
                1: [[0.5, 0.5]],
                2: [
                  [0.25, 0.25],
                  [0.75, 0.75],
                ],
                3: [
                  [0.25, 0.25],
                  [0.5, 0.5],
                  [0.75, 0.75],
                ],
                4: [
                  [0.25, 0.25],
                  [0.75, 0.25],
                  [0.25, 0.75],
                  [0.75, 0.75],
                ],
                5: [
                  [0.25, 0.25],
                  [0.75, 0.25],
                  [0.5, 0.5],
                  [0.25, 0.75],
                  [0.75, 0.75],
                ],
                6: [
                  [0.25, 0.25],
                  [0.75, 0.25],
                  [0.25, 0.5],
                  [0.75, 0.5],
                  [0.25, 0.75],
                  [0.75, 0.75],
                ],
              };

              ctx.shadowBlur = 3;
              ctx.shadowColor = "rgba(0,0,0,0.15)";
              ctx.shadowOffsetX = 1;
              ctx.shadowOffsetY = 1;
              ctx.fillStyle = "#1a1a2e";

              const dots = dotPositions[val] || dotPositions[1];
              const dotSize2 = diceSize * 0.13;
              dots.forEach((pos) => {
                const dx = diceX + pos[0] * diceSize;
                const dy = diceY + pos[1] * diceSize;
                ctx.beginPath();
                ctx.arc(dx, dy, dotSize2, 0, Math.PI * 2);
                ctx.fill();
              });

              ctx.shadowBlur = 0;
              ctx.shadowOffsetX = 0;
              ctx.shadowOffsetY = 0;

              if (playerPosition === 0) {
                ctx.shadowBlur = 15;
                ctx.shadowColor = "rgba(76,175,80,0.5)";
                ctx.beginPath();
                ctx.arc(startX + 100, startY + startH / 2, 50, 0, Math.PI * 2);
                ctx.fillStyle = "#4CAF50";
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = "white";
                ctx.font = "bold 60px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("👤", startX + 100, startY + startH / 2);
              }

              if (computerPosition === 0) {
                ctx.shadowBlur = 15;
                ctx.shadowColor = "rgba(233,69,96,0.5)";
                ctx.beginPath();
                ctx.arc(startX + 190, startY + startH / 2, 50, 0, Math.PI * 2);
                ctx.fillStyle = "#e94560";
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = "white";
                ctx.font = "bold 60px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("🤖", startX + 190, startY + startH / 2);
              }

              if (playerPosition > 0 && playerPosition <= boardSize) {
                const row = Math.floor((playerPosition - 1) / cols);
                const col = (playerPosition - 1) % cols;
                const px = boardStartX + col * cellSize + cellSize / 2;
                const py = boardStartY + row * cellSize + cellSize / 2;

                ctx.shadowBlur = 15;
                ctx.shadowColor = "rgba(76,175,80,0.5)";
                ctx.beginPath();
                ctx.arc(px - 12, py - 12, 42, 0, Math.PI * 2);
                ctx.fillStyle = "#4CAF50";
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = "white";
                ctx.font = "bold 50px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("👤", px - 12, py - 12);
              }

              if (computerPosition > 0 && computerPosition <= boardSize) {
                const row = Math.floor((computerPosition - 1) / cols);
                const col = (computerPosition - 1) % cols;
                const px = boardStartX + col * cellSize + cellSize / 2;
                const py = boardStartY + row * cellSize + cellSize / 2;

                ctx.shadowBlur = 15;
                ctx.shadowColor = "rgba(233,69,96,0.5)";
                ctx.beginPath();
                ctx.arc(px + 12, py + 12, 42, 0, Math.PI * 2);
                ctx.fillStyle = "#e94560";
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = "white";
                ctx.font = "bold 50px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("🤖", px + 12, py + 12);
              }

              const goalRow = Math.floor((boardSize - 1) / cols);
              const goalCol = (boardSize - 1) % cols;
              const gx = boardStartX + goalCol * cellSize + cellSize / 2;
              const gy = boardStartY + goalRow * cellSize + cellSize / 2;

              ctx.shadowBlur = 20;
              ctx.shadowColor = "rgba(255,215,0,0.3)";
              ctx.strokeStyle = "#FFD93D";
              ctx.lineWidth = 3;
              ctx.setLineDash([5, 5]);
              ctx.beginPath();
              ctx.arc(gx, gy, 28, 0, Math.PI * 2);
              ctx.stroke();
              ctx.setLineDash([]);
              ctx.shadowBlur = 0;

              ctx.fillStyle = "#FFD93D";
              ctx.font = "32px Arial";
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.fillText("🏆", gx, gy);
            }
          }

          if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (
              x,
              y,
              w,
              h,
              radii,
            ) {
              const r = typeof radii === "number" ? radii : radii || 0;
              this.moveTo(x + r, y);
              this.arcTo(x + w, y, x + w, y + h, r);
              this.arcTo(x + w, y + h, x, y + h, r);
              this.arcTo(x, y + h, x, y, r);
              this.arcTo(x, y, x + w, y, r);
              return this;
            };
          }

          render();

          return {
            cleanup: () => {
              if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
              }
              delete window.rollDice;
              delete window.resetBoardGame;
            },
          };
        };
      }

      // SERVICE WORKER FOR OFFLINE
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("/sw.js")
          .then(() => console.log("✅ Service Worker registered"))
          .catch(() => console.log("❌ Service Worker registration failed"));
      }

      console.log("🎮 Game Collection loaded!");
      console.log(`📱 ${GAMES.length} games available offline`);
    </script>
  </body>
</html>
